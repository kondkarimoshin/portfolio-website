spring:
  application:
    name: portfolio-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:debug}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

resend:
  api:
    key: ${RESEND_API_KEY}
  from:
    email: ${RESEND_FROM_EMAIL}

info:
  app:
    version: "@project.version@"
    description: Portfolio Consultation Backend API

server:
  port: ${PORT:8080}
  shutdown: graceful

app:
  cors:
    allowed-origins: http://localhost:5173,https://*.vercel.app