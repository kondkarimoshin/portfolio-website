spring:
  application:
    name: portfolio-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:debug}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:mkondkari.portfolio@gmail.com}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

info:
  app:
    version: "@project.version@"
    description: Portfolio Consultation Backend API

server:
  port: ${PORT:8080}
  shutdown: graceful